<circle cx="18" cy="17" r="5" fill="#f26b5b"/><circle cx="34" cy="17" r="5" fill="#f5bf4f"/><circle cx="50" cy="17" r="5" fill="#5fc454"/>
<rect x="72" y="8" width="420" height="18" rx="9" fill="#fff"/><text x="84" y="21" font-size="11" fill="#5d6675">dcc.godaddy.com/control/dnsmanagement?domainName=…</text>
<rect y="34" width="640" height="38" fill="#00838c"/><text x="18" y="58" font-size="15" font-weight="700" fill="#fff">GoDaddy - DNS records</text>
<text x="20" y="98" font-size="13" font-weight="700">DNS Records</text><rect x="500" y="84" width="120" height="28" rx="5" fill="#111"/><text x="560.0" y="102" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Add New Record</text><rect x="20" y="112" width="600" height="26" fill="#eef1f3"/><text x="30" y="129" font-size="11" font-weight="700" fill="#5d6675">Type</text><text x="110" y="129" font-size="11" font-weight="700" fill="#5d6675">Name</text><text x="220" y="129" font-size="11" font-weight="700" fill="#5d6675">Data</text><text x="420" y="129" font-size="11" font-weight="700" fill="#5d6675">TTL</text><text x="520" y="129" font-size="11" font-weight="700" fill="#5d6675"></text><rect x="20" y="138" width="600" height="30" fill="#fff" stroke="#eef1f3"/><text x="30" y="157" font-size="12">A</text><text x="110" y="157" font-size="12">@</text><text x="220" y="157" font-size="12">Parked → your server IP</text><text x="420" y="157" font-size="12">600 seconds</text><text x="560" y="157" font-size="13">✎  🗑</text><rect x="20" y="168" width="600" height="30" fill="#fff" stroke="#eef1f3"/><text x="30" y="187" font-size="12">CNAME</text><text x="110" y="187" font-size="12">www</text><text x="220" y="187" font-size="12">@</text><text x="420" y="187" font-size="12">1 Hour</text><text x="560" y="187" font-size="13">✎  🗑</text><rect x="20" y="198" width="600" height="30" fill="#fff" stroke="#eef1f3"/><text x="30" y="217" font-size="12">NS</text><text x="110" y="217" font-size="12">@</text><text x="220" y="217" font-size="12">ns11.domaincontrol.com</text><text x="420" y="217" font-size="12">1 Hour</text><text x="560" y="217" font-size="13">✎  🗑</text><rect x="20" y="228" width="600" height="30" fill="#fff" stroke="#eef1f3"/><text x="30" y="247" font-size="12">MX</text><text x="110" y="247" font-size="12">@</text><text x="220" y="247" font-size="12">mail…(keep)</text><text x="420" y="247" font-size="12">1 Hour</text><text x="560" y="247" font-size="13">✎  🗑</text><rect x="20" y="138" width="600" height="30" rx="6" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="622" cy="138" r="11" fill="#e8590c"/><text x="622" y="142" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="20" y="168" width="600" height="30" rx="6" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="622" cy="168" r="11" fill="#e8590c"/><text x="622" y="172" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="20" y="290" font-size="12" fill="#5d6675">1: edit the A record "@" so its value is your server IP (copy it from Rover).</text><text x="20" y="310" font-size="12" fill="#5d6675">2: www should point to @.  Keep MX/TXT records - they are your email.</text>
<text x="622" y="350" font-size="9" fill="#98a5ae" text-anchor="end">Illustration - the real page may look slightly different</text>
</svg>