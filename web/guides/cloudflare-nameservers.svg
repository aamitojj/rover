<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI,Arial,sans-serif">
<rect width="640" height="360" rx="10" fill="#f4f6f8"/>
<rect width="640" height="34" rx="10" fill="#e3e7ea"/><rect y="24" width="640" height="10" fill="#e3e7ea"/>
<circle cx="18" cy="17" r="5" fill="#f26b5b"/><circle cx="34" cy="17" r="5" fill="#f5bf4f"/><circle cx="50" cy="17" r="5" fill="#5fc454"/>
<rect x="72" y="8" width="420" height="18" rx="9" fill="#fff"/><text x="84" y="21" font-size="11" fill="#5d6675">dash.cloudflare.com/…/overview</text>
<rect y="34" width="640" height="38" fill="#f38020"/><text x="18" y="58" font-size="15" font-weight="700" fill="#fff">Cloudflare - Change your nameservers</text>
<rect x="20" y="88" width="600" height="110" rx="6" fill="#fff" stroke="#dde3e6"/><text x="34" y="112" font-size="12.5" font-weight="700">Replace your current nameservers with Cloudflare's</text><text x="34" y="138" font-size="11.5" fill="#5d6675">Remove:  ns11.domaincontrol.com   ns12.domaincontrol.com</text><text x="34" y="162" font-size="11.5">Add:  ava.ns.cloudflare.com   bob.ns.cloudflare.com</text><rect x="30" y="148" width="420" height="22" rx="6" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="452" cy="148" r="11" fill="#e8590c"/><text x="452" y="152" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="20" y="210" width="600" height="110" rx="6" fill="#fff" stroke="#dde3e6"/><text x="34" y="234" font-size="12.5" font-weight="700">At your registrar (e.g. GoDaddy › Domain › Nameservers › Change)</text><text x="34" y="258" font-size="11.5">Choose "I'll use my own nameservers" and paste both Cloudflare names.</text><rect x="30" y="244" width="500" height="22" rx="6" fill="none" stroke="#e8590c" stroke-width="3"/><circle cx="532" cy="244" r="11" fill="#e8590c"/><text x="532" y="248" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="34" y="290" font-size="11.5" fill="#5d6675">Copy MX/TXT email records into Cloudflare first. Changes take up to 24 hours.</text>
<text x="622" y="350" font-size="9" fill="#98a5ae" text-anchor="end">Illustration - the real page may look slightly different</text>
</svg>